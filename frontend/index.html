<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Le titre et la description de la page d'accueil. L'application les
         remplace à chaque changement de page (src/seo/meta.js) ; ce sont donc
         ces valeurs-ci que voient les robots qui n'exécutent pas de
         JavaScript, et il faut qu'elles décrivent la racine du site.

         Le titre faisait dix caractères — « Inside ODC » — et la description
         soixante-dix-huit. Trop court pour l'un comme pour l'autre : un
         moteur de recherche dispose d'une ligne pour donner envie de cliquer,
         et il ne la remplit pas à notre place. -->
    <title>Inside ODC Sénégal — se former aux métiers du numérique</title>
    <meta
      name="description"
      content="Formation aux métiers du numérique, fabrication et accompagnement de projets dans un centre numérique au Sénégal : les quatre pôles et les publics accueillis."
    />

    <!-- L'adresse de référence. L'hébergement sert le même document pour toute
         adresse du site : sans elle, les dizaines de chemins de l'application
         passent pour autant de pages en double aux yeux des moteurs. -->
    <link rel="canonical" href="https://inside-odc.com/" />

    <!-- ===== L'APERÇU D'UN LIEN PARTAGÉ =====
         Ce qui s'affiche quand quelqu'un colle l'adresse du site dans une
         conversation WhatsApp, sur Facebook ou sur LinkedIn. Rien de tout cela
         n'existait : un lien partagé n'affichait qu'une adresse nue, sans
         titre, sans image et sans résumé. C'est la correction la plus utile de
         toutes, parce que ces trois canaux sont ceux par lesquels ce site est
         réellement diffusé — et aucun de leurs robots n'exécute le JavaScript
         qui remplit la page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inside ODC Sénégal" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:url" content="https://inside-odc.com/" />
    <meta property="og:title" content="Inside ODC Sénégal — se former aux métiers du numérique" />
    <meta
      property="og:description"
      content="Formation aux métiers du numérique, fabrication et accompagnement de projets dans un centre numérique au Sénégal : les quatre pôles et les publics accueillis."
    />
    <meta property="og:image" content="https://inside-odc.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Inside ODC Sénégal — apprendre, créer, entreprendre" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inside ODC Sénégal — se former aux métiers du numérique" />
    <meta
      name="twitter:description"
      content="Formation aux métiers du numérique, fabrication et accompagnement de projets dans un centre numérique au Sénégal : les quatre pôles et les publics accueillis."
    />
    <meta name="twitter:image" content="https://inside-odc.com/og.png" />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Abdoul Mouhamed FALL" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installation sur l'écran d'accueil : la plateforme est utilisée debout,
         en salle, sur un téléphone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inside ODC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- La couleur de la barre système suit le thème de l'utilisateur. -->
    <meta name="theme-color" content="#FF7900" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)" />

    <!-- Applique le thème avant le premier rendu, pour éviter l'éclair blanc
         au chargement quand l'utilisateur a choisi le mode sombre. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {
          /* stockage bloqué : on garde le thème clair par défaut */
        }
      })();
    </script>

    <!-- ===== DONNÉES STRUCTURÉES =====
         Ce que le site est, dit dans la forme que les moteurs et les
         assistants savent lire sans interpréter la page.

         Ce qui est déclaré ici est volontairement modeste. Le site parle d'un
         centre numérique mais n'est pas édité par ce centre : le pied de page
         le dit — « site indépendant, édité par Abdoul Mouhamed FALL, il
         n'émane d'aucune entreprise ». Se déclarer « EducationalOrganization »
         reviendrait donc à se présenter comme le centre lui-même, ce qui est
         faux, et ce que les moteurs sanctionnent quand ils s'en aperçoivent.

         La déclaration « SoftwareApplication » qui décrivait l'outil de suivi
         a été retirée en même temps que les sections qui en parlaient : la
         page d'accueil s'adresse au public et ne présente plus la plateforme
         interne, les données structurées doivent dire la même chose.

         Restent un site et une page, avec leur éditeur. C'est vrai, et c'est
         tout ce qui peut l'être.

         « sameAs » — les profils officiels sur les réseaux sociaux — est
         volontairement absent : aucune adresse de compte n'a été fournie, et
         en inventer une pointerait vers un compte qui n'existe pas ou qui
         appartient à quelqu'un d'autre. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://inside-odc.com/#site",
            "url": "https://inside-odc.com/",
            "name": "Inside ODC Sénégal",
            "description": "Formation aux métiers du numérique, fabrication et accompagnement de projets dans un centre numérique au Sénégal.",
            "inLanguage": "fr-SN",
            "author": {
              "@type": "Person",
              "name": "Abdoul Mouhamed FALL"
            }
          },
          {
            "@type": "WebPage",
            "@id": "https://inside-odc.com/#accueil",
            "url": "https://inside-odc.com/",
            "name": "Inside ODC Sénégal — se former aux métiers du numérique",
            "isPartOf": { "@id": "https://inside-odc.com/#site" },
            "inLanguage": "fr-SN"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Filet de secours contre la page blanche.

         Un service worker qui a gardé une ancienne coquille en cache peut
         servir un document dont les fichiers JavaScript n'existent plus : ils
         répondent 404, rien ne s'exécute, et la page reste vide. L'application
         ne peut pas se réparer elle-même dans ce cas — son propre code n'a
         jamais démarré. Il faut donc que le secours vive ici, dans le document,
         en clair : ce script-ci s'exécute même quand tout le reste a échoué.

         La personne n'a alors rien à faire. Sans lui, elle reste devant un
         écran blanc, et seule une désinscription manuelle du service worker
         depuis les outils de développement la débloque — ce qu'on ne peut
         demander à personne.

         Une seule tentative par session : si la page est encore vide après le
         rechargement, c'est autre chose, et boucler n'y changerait rien. -->
    <script>
      (function () {
        var DELAI_MS = 8000;
        var CLE = "reparation_coquille";

        function estVide() {
          var r = document.getElementById("root");
          return !r || r.childElementCount === 0;
        }

        function dejaTente() {
          try {
            return sessionStorage.getItem(CLE) === "1";
          } catch (e) {
            /* Stockage bloqué : on s'abstient plutôt que de risquer une
               boucle de rechargements qu'on ne pourrait pas arrêter. */
            return true;
          }
        }

        setTimeout(function () {
          if (!estVide() || dejaTente()) return;
          try {
            sessionStorage.setItem(CLE, "1");
          } catch (e) {
            return;
          }

          var travaux = [];
          if ("serviceWorker" in navigator) {
            travaux.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (liste) {
                  return Promise.all(liste.map(function (r) { return r.unregister(); }));
                })
                .catch(function () {})
            );
          }
          if (window.caches && caches.keys) {
            travaux.push(
              caches
                .keys()
                .then(function (cles) {
                  return Promise.all(cles.map(function (c) { return caches.delete(c); }));
                })
                .catch(function () {})
            );
          }

          Promise.all(travaux).then(function () {
            location.reload();
          });
        }, DELAI_MS);
      })();
    </script>
  </body>
</html>
