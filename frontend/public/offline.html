<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hors ligne — Inside ODC</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f8fc;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --brand: #ff7900;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #12100e;
          --card: #1c1a17;
          --ink: #f2efec;
          --muted: #9c948d;
          --line: rgba(255, 255, 255, 0.1);
          --brand: #ff9233;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        text-align: center;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 0.875rem;
        background: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg { width: 1.75rem; height: 1.75rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
      .hint {
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        font-size: 0.875rem;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 2.75rem;
        border: none;
        border-radius: 0.75rem;
        background: var(--brand);
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>

      <h1>Pas de connexion</h1>
      <p>
        Inside ODC a besoin du réseau pour afficher vos activités et vos
        bénéficiaires.
      </p>

      <p class="hint">
        Vos données sont sur le serveur, rien n'est perdu. Reconnectez-vous au
        Wi-Fi ou aux données mobiles, puis réessayez.
      </p>

      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>

    <script>
      /* Recharge automatiquement des que la connexion revient : inutile de
         faire attendre quelqu'un qui a juste traversé une zone sans réseau. */
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
